name: Build

on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c2, esp32c3, esp32c5, esp32c6, esp32c61, esp32h2, esp32p4]
    steps:
      - uses: actions/checkout@v5
      - name: Build examples/quickstart for ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: examples/quickstart
          command: idf.py build
